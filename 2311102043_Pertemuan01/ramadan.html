<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Ramadan</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="text-light">

    <img src="bg-ramadan.jpg" class="position-fixed top-0 start-0 w-100 h-100 object-fit-cover z-n1" alt="Background Ramadan">
    
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100 text-center position-relative z-1">
        
        <h1 class="display-1 fw-bold text-warning mb-3">Marhaban Ya Ramadan</h1>
        <p class="lead mb-5 text-light fw-semibold">Bulan suci yang penuh berkah, ampunan, dan kejutan!</p>

        <button type="button" class="btn btn-warning btn-lg fw-bold shadow-lg rounded-pill px-5 py-3" data-bs-toggle="modal" data-bs-target="#thrModal">
            Buka Kejutan Spesial 🎁
        </button>
    </div>

    <div class="position-fixed bottom-0 start-50 translate-middle-x mb-3 text-center small">
        With ❤️ by Rifky Dwi Mahardika
    </div>

    <div class="modal fade" id="thrModal" tabindex="-1" aria-labelledby="thrModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white shadow-lg border border-warning">
                
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-warning" id="thrModalLabel">Alhamdulillah! 🎉</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body text-center py-5">
                    <h2 class="display-4 fw-bold text-warning mb-3">Selamat!</h2>
                    <p class="fs-4">Anda Mendapatkan THR!</p>
                    <p class="small opacity-75">Semoga puasanya lancar dan rezekinya berkah ya.</p>
                </div>
                
                <div class="modal-footer border-secondary justify-content-center">
                    <button type="button" class="btn btn-warning fw-bold px-4 rounded-pill" data-bs-dismiss="modal">
                        Aamiin, Terima Kasih
                    </button>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
